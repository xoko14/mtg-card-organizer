[package]
name = "mtg-card-organizer"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.6.0"
fuzzy-matcher = "0.3.7"
iced = { version = "0.12.1", features = ["tokio", "advanced", "image"] }
native-dialog = "0.7.0"
reqwest = { version = "0.12.4", features = ["blocking"] }
rust-fuzzy-search = "0.1.1"
scryfall = { version = "0.17.10" , features = ["unknown_variants"]}
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
uuid = { version = "1.8.0", features = ["v4"] }
relm4 = { version = "0.9.1", features = ["libadwaita", "gnome_46"]}
relm4-components = { version = "0.9.1", features = ["web"]}
relm4-icons = { version = "0.10.0-beta.2", features = ["icon-development-kit"]}

[build-dependencies]
relm4-icons-build = "0.10.0-beta.2"